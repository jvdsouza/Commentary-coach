version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commentary_coach
      POSTGRES_USER: commentary_coach
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commentary_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PNPM_STORE_DIR=/app/.pnpm-store
      - DATABASE_URL=postgresql://commentary_coach:dev_password@postgres:5432/commentary_coach
    env_file:
      - .env
    volumes:
      - ../backend:/app/backend
      - ../shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
      - /app/backend/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter backend db:push --force && pnpm --filter backend dev"
    restart: unless-stopped

volumes:
  postgres_data:
