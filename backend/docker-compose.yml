version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # Uncomment for development with volume mounting
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    # command: pnpm dev
    restart: unless-stopped
    # Optional: add resource limits
